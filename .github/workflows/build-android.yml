name: Build Bolso Bravo Android APK
on:
  push:
    branches: ["build/bolso-bravo-v03"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p bolso-bravo-android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bolso-bravo-apk
          path: bolso-bravo-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
